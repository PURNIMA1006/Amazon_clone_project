<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="navbar">
            <div class="nav-logo border">
                <div class="logo"></div>
            </div>

            <div class="nav-address border">
                <p class="add-one">Deliver to</p>
                <div class="add-icon">
                    <i class="fa-solid fa-location-dot"></i>
                    <p class="add-two">India</p>
                </div>
            </div>

            <div class="nav-search">
                <select class="search-select">
                    <option >All</option>
                    <option value="1">All Departments</option>
                    <option value="2">Art & Crafts</option>
                    <option value="3">Automotive</option>
                    <option value="4">Baby</option>
                </select>
                <input placeholder="Search Amazon" class="search-input">
                <div class="search-icon">
                    <i class="fa-solid fa-magnifying-glass "></i>
                </div>
            </div>

            <div class="nav-lang" >
                <img src="/Amazon_clone_project/flag.png" class="flag" alt="flag">
                <select class="lang-select border">
                    <option value="1">EN </option>
                    <option value="2">हिंदी</option>
                    <option value="3">தமிழ்</option>
                </select>
            </div>

            <div class="nav-signin border">
                <p class="nav-one">Hello, Sign in</p>
                <p class="nav-two">Account & Lists <i class="fa-solid fa-caret-down"></i></p>
            </div>

            <div class="nav-returns border">
                <p class="nav-one">Returns</p>
                <p class="nav-two">& Orders</p>
            </div>

            <div class="nav-cart border">
                 <i class="fa-solid fa-cart-shopping" ></i>
                <p> Cart</p>
            </div>
        </div>

        <div class="panel">
                <div class="panel-all border">
                    <i class="fa-solid fa-bars"></i>
                    All
                </div>
                <div class="panel-ops">
                    <p>Fresh</p>
                    <p>Electronics</p>
                    <p>Prime Video</p>
                    <p>Sell</p>
                    <p>Today's Deals</p>
                    <p>Amazon Pay</p>
                    <p>Buy Again</p>
                    <p>Gift ideas</p>
                    <p>Amazon basics</p>
                    <p>Subscribe & save</p>
                </div>
                <div class="panel-deals border">
                    Shop deals in Electronics
                </div>
        </div>
    </header>  

</body>
</html>
